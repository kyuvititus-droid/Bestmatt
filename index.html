<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bestmatt</title>
<meta name="description" content="Bestmatt sells quality products at great prices.">
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; margin: 0; background: #f5f5f5; color: #222; }
  header { background: #ff6a00; padding: 10px 12px; position: sticky; top: 0; z-index: 5; }
  .logo { color: #fff; font-size: 22px; font-weight: bold; margin-bottom: 8px; }
  .search { display: flex; background: #fff; border-radius: 25px; overflow: hidden; }
  .search input { flex: 1; border: none; padding: 11px 15px; font-size: 15px; outline: none; }
  .search span { background: #222; color: #fff; padding: 11px 18px; font-size: 14px; }
  .cats { background: #fff; padding: 10px; overflow-x: auto; white-space: nowrap; }
  .chip { display: inline-block; padding: 7px 14px; margin-right: 8px; border-radius: 20px; background: #f0f0f0; font-size: 14px; }
  .chip.on { background: #ff6a00; color: #fff; }
  .banner { margin: 10px 12px; padding: 22px 16px; border-radius: 10px; color: #fff;
            background: linear-gradient(135deg, #222, #ff6a00); }
  .banner h2 { margin: 0 0 6px; font-size: 20px; }
  .banner p { margin: 0; font-size: 14px; }
  .title { margin: 14px 12px 8px; font-size: 17px; font-weight: bold; }
  #list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 12px 20px; }
  .card { background: #fff; border-radius: 8px; overflow: hidden; }
  .card img { width: 100%; height: 150px; object-fit: cover; background: #ddd; display: block; }
  .info { padding: 8px 10px 12px; }
  .name { font-size: 14px; height: 36px; overflow: hidden; }
  .price { color: #ff6a00; font-weight: bold; font-size: 17px; margin-top: 4px; }
  .moq { color: #888; font-size: 12px; margin-top: 2px; }
  #modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); align-items: flex-end; z-index: 10; }
  .sheet { background: #fff; width: 100%; max-height: 90%; overflow-y: auto; border-radius: 16px 16px 0 0; padding: 15px; }
  .sheet img { width: 100%; max-height: 300px; object-fit: cover; border-radius: 8px; background: #ddd; }
  .sheet h3 { margin: 12px 0 4px; }
  .btn { display: block; background: #ff6a00; color: #fff; text-align: center; padding: 13px;
         border-radius: 25px; text-decoration: none; font-weight: bold; margin-top: 14px; }
  .close { background: #eee; border: none; padding: 8px 14px; border-radius: 15px; float: right; }
  footer { text-align: center; padding: 20px; color: #888; font-size: 13px; }
  @media (min-width: 700px) { #list { grid-template-columns: repeat(4, 1fr); } }
</style>
</head>
<body>

<header>
  <div class="logo">Bestmatt</div>
  <div class="search">
    <input id="q" placeholder="Search products..." oninput="render()">
    <span>Search</span>
  </div>
</header>

<div class="cats" id="cats"></div>

<div class="banner">
  <h2>Quality products, great prices</h2>
  <p>Shop electronics, clothing, home and beauty</p>
</div>

<div class="title">Popular products</div>
<div id="list"></div>

<div id="modal" onclick="closeProduct()">
  <div class="sheet" onclick="event.stopPropagation()">
    <button class="close" onclick="closeProduct()">Close</button>
    <img id="mImg" src="">
    <h3 id="mName"></h3>
    <div class="price" id="mPrice"></div>
    <div class="moq" id="mMoq"></div>
    <p id="mDesc"></p>
    <a class="btn" id="mBtn" href="#">Contact seller</a>
  </div>
</div>

<footer>© Bestmatt. All rights reserved.</footer>

<script>
  // EDIT THIS LIST: one line per product
  const products = [
    { category: "Electronics", name: "Smartphone", price: "$200", moq: "Min. order: 1 piece", image: "phone.jpg", description: "Fast phone with a big screen and long battery life." },
    { category: "Electronics", name: "Wireless Headphones", price: "$25", moq: "Min. order: 5 pieces", image: "headphones.jpg", description: "Clear sound and long battery life." },
    { category: "Clothing", name: "Cotton T-Shirt", price: "$10", moq: "Min. order: 10 pieces", image: "tshirt.jpg", description: "Soft cotton T-shirt in different sizes." },
    { category: "Clothing", name: "Sneakers", price: "$30", moq: "Min. order: 2 pairs", image: "sneakers.jpg", description: "Comfortable sneakers for everyday use." },
    { category: "Home and Kitchen", name: "Non-stick Frying Pan", price: "$12", moq: "Min. order: 5 pieces", image: "pan.jpg", description: "Durable non-stick frying pan." },
    { category: "Beauty", name: "Body Lotion", price: "$6", moq: "Min. order: 12 pieces", image: "lotion.jpg", description: "Moisturizing lotion for smooth skin." }
  ];

  // Put your WhatsApp number here: country code first, no + or spaces
  const whatsapp = "1234567890";

  let activeCat = "All";
  const cats = ["All", ...new Set(products.map(p => p.category))];

  function drawCats() {
    document.getElementById("cats").innerHTML = cats.map(c =>
      `<span class="chip ${c === activeCat ? "on" : ""}" onclick="setCat('${c}')">${c}</span>`).join("");
  }

  function setCat(c) { activeCat = c; drawCats(); render(); }

  function render() {
    const q = document.getElementById("q").value.toLowerCase();
    let html = "";
    products.forEach((p, i) => {
      if ((activeCat === "All" || p.category === activeCat) && p.name.toLowerCase().includes(q)) {
        html += `<div class="card" onclick="openProduct(${i})">
          <img src="${p.image}" alt="">
          <div class="info"><div class="name">${p.name}</div>
          <div class="price">${p.price}</div><div class="moq">${p.moq}</div></div></div>`;
      }
    });
    document.getElementById("list").innerHTML = html || "<p>No products found.</p>";
  }

  function openProduct(i) {
    const p = products[i];
    document.getElementById("mImg").src = p.image;
    document.getElementById("mName").textContent = p.name;
    document.getElementById("mPrice").textContent = p.price;
    document.getElementById("mMoq").textContent = p.moq;
    document.getElementById("mDesc").textContent = p.description;
    document.getElementById("mBtn").href = "https://wa.me/" + whatsapp + "?text=" + encodeURIComponent("Hi, I am interested in " + p.name);
    document.getElementById("modal").style.display = "flex";
  }

  function closeProduct() { document.getElementById("modal").style.display = "none"; }

  drawCats();
  render();
</script>
</body>
</html>
